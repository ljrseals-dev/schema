[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-review"
version = "0.3.0"
description = "Evidence-classed review schema and validator for quantized-type proposals in the Cmajor ONNX emitter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lewis James Seals Jr" }]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.20,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schema_review = ["data/*.json"]
