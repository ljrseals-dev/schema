name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m schema_review examples/review_example.json
      - name: Non-editable install finds the bundled schema
        run: |
          python -m venv /tmp/ni && /tmp/ni/bin/pip install .
          cd /tmp && /tmp/ni/bin/python -m schema_review "$GITHUB_WORKSPACE/examples/review_example.json"
