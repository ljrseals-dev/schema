name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (editable)
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate bundled fixture
        run: python -m schema_review tests/fixtures/review_example.json
      - name: Independent execution and mutation validation
        run: python scripts/independent_check.py validation_report.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: independent-validation-report
          path: validation_report.json
      - name: Non-editable install finds the bundled schema
        run: |
          python -m venv /tmp/ni
          /tmp/ni/bin/pip install .
          cd /tmp && /tmp/ni/bin/python -m schema_review "$GITHUB_WORKSPACE/tests/fixtures/review_example.json"
